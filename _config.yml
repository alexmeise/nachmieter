title: Villa à Donatyre
description: >-
  Magnifique villa individuelle à Donatyre — lumineuse, grand jardin,
  géothermie et panneaux solaires.

# Set this to "<github-user>/<repo>" once the repo exists.
# Needed by the github-pages metadata plugin for local builds.
repository: alexmeise/nachmieter

# Site served under https://alexandermeise.com/nachmieter/
url: https://alexandermeise.com
baseurl: /nachmieter

# minima is the default GitHub Pages theme
theme: minima

# minima options
minima:
  skin: classic

# Build settings
markdown: kramdown
permalink: pretty

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
